<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Смотрим вместе</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
<style>
  :root {
    --bg: #0e0d11;
    --panel: #18161d;
    --panel-2: #211f27;
    --line: #2d2a35;
    --text: #f1eef6;
    --muted: #9a94a6;
    --accent: #ffb547;
    --accent-ink: #1d1406;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  button {
    cursor: pointer; border: 1px solid var(--line); background: var(--panel-2);
    border-radius: 10px; padding: 8px 12px; transition: background .15s, border-color .15s;
  }
  button:hover { border-color: #46414f; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.off { background: #3a1f24; border-color: #5c2a32; color: #ffb4b4; }
  input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 11px; outline: none;
  }
  input[type=text]:focus { border-color: var(--accent); }

  header {
    height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; font-size: 16px; letter-spacing: .2px; }
  .logo span { color: var(--accent); }
  .status { display: flex; align-items: center; gap: 8px; color: var(--muted); margin-left: 8px; min-width: 0; }
  .status i { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: none; }
  .status.ok i { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status.bad i { background: var(--bad); }
  .status b { color: var(--text); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header .spacer { flex: 1; }

  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px;
    padding: 16px; height: calc(100vh - 56px);
  }
  .stage { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .screen {
    position: relative; flex: 1; min-height: 0; background: #000; border-radius: var(--radius);
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  .screen iframe { width: 100%; height: 100%; border: 0; display: block; }
  .reactions { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .next-up { position: absolute; right: 14px; bottom: 64px; z-index: 3; display: flex; gap: 8px; align-items: center;
    background: rgba(12, 12, 16, .9); border: 1px solid rgba(255, 255, 255, .12); border-radius: 12px; padding: 10px 12px; }
  .reactions span {
    position: absolute; bottom: 10%; font-size: 42px;
    animation: floatUp 2.6s ease-out forwards;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.6); opacity: 0; }
    15% { opacity: 1; transform: translateY(-20px) scale(1.1); }
    100% { transform: translateY(-320px) scale(1); opacity: 0; }
  }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .bar .partner-time { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: auto; }
  .bar form { display: flex; gap: 8px; flex: 1 1 320px; }
  .emoji { padding: 6px 9px; font-size: 18px; line-height: 1; }

  aside { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .call { display: flex; flex-direction: column; gap: 8px; }
  .remote {
    position: relative; aspect-ratio: 4 / 3; background: var(--panel); border-radius: var(--radius);
    overflow: hidden; border: 1px solid var(--line);
  }
  .remote video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .remote iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; background: var(--panel); }
  .ninja-out { position: absolute; left: 8px; bottom: 8px; z-index: 3; font-size: 12px; padding: 5px 10px; }
  .placeholder {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px;
    align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 12px;
  }
  .avatar {
    width: 64px; height: 64px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--text);
  }
  .local {
    position: absolute; right: 8px; bottom: 8px; width: 30%; aspect-ratio: 4 / 3; border-radius: 10px;
    overflow: hidden; border: 2px solid rgba(255,255,255,.18); background: #000;
  }
  .local video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: block; }
  .tag {
    position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.55); padding: 2px 8px;
    border-radius: 999px; font-size: 12px;
  }
  .controls { display: flex; gap: 6px; align-items: center; }
  .controls button { flex: none; }
  .controls label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-left: auto; }
  .controls input[type=range] { width: 80px; accent-color: var(--accent); }

  .chat {
    flex: 1; min-height: 180px; display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  .messages { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 85%; padding: 6px 10px; border-radius: 12px; background: var(--panel-2); word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: #3b2c12; }
  .msg.sys { align-self: center; background: none; color: var(--muted); font-size: 12px; padding: 0; text-align: center; }
  .chat form { display: flex; gap: 6px; padding: 8px; border-top: 1px solid var(--line); }

  .toast {
    position: fixed; left: 50%; top: 68px; transform: translateX(-50%); z-index: 50;
    background: var(--panel-2); border: 1px solid var(--line); padding: 8px 14px; border-radius: 999px;
    opacity: 0; transition: opacity .25s; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* lobby */
  .lobby {
    position: fixed; inset: 0; z-index: 100; background: rgba(8,7,10,.92); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 14px;
  }
  .card h1 { margin: 0; font-size: 22px; }
  .card p { margin: 0; color: var(--muted); }
  .card .checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .card .checks label { display: flex; gap: 6px; align-items: center; }
  .card .hint { font-size: 12px; }
  .hidden { display: none !important; }

  /* diagnostics screen */
  .diag {
    position: fixed; inset: 0; z-index: 200; background: #000; cursor: none;
    display: flex; align-items: center; justify-content: center; transition: opacity .8s;
  }
  .diag.mirror { cursor: default; }
  .diag.bye { opacity: 0; }
  .diag video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
    opacity: 0; filter: grayscale(.5) brightness(.75) blur(1.5px); transition: opacity 4s;
  }
  .diag.mirror video { opacity: .22; }
  .diag svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .diag svg path {
    fill: none; stroke: #ff2b2b; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
    filter: drop-shadow(0 0 6px rgba(255,30,30,.55));
  }
  .diag-label {
    position: absolute; color: #ff3030; font: 700 clamp(28px, 3.6vw, 46px)/1.05 Caveat, "Segoe Print", cursive;
    max-width: min(80vw, 380px); text-align: center; transform: rotate(-5deg); opacity: 0; transition: opacity .6s;
    text-shadow: 0 2px 12px rgba(0,0,0,.7);
  }
  .diag-label.show { opacity: 1; }
  .diag-text.top { position: absolute; top: 4vh; left: 0; right: 0; margin: 0 auto; font-size: clamp(24px, 4vw, 42px); }
  .diag-foot {
    position: absolute; bottom: 4vh; left: 0; right: 0; display: flex; flex-direction: column;
    align-items: center; gap: 12px; opacity: 0; transition: opacity .6s;
  }
  .diag-foot.show { opacity: 1; }
  .diag.camera { cursor: default; }
  .diag.camera video { opacity: 1; filter: none; transition: opacity 1.5s; }
  .diag-foot small { max-width: 520px; text-align: center; padding: 0 16px; }
  .diag.consent svg, .diag.consent .diag-label, .diag.consent .diag-text { opacity: 0; transition: opacity .5s; }
  .diag-choice { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  /* sound calibration */
  .calib {
    position: fixed; inset: 0; z-index: 150; background: rgba(8,7,10,.88); backdrop-filter: blur(6px);
    display: flex; align-items: center; justify-content: center; padding: 16px; transition: opacity .6s;
  }
  .calib.bye { opacity: 0; }
  .calib-card { max-width: 380px; text-align: center; align-items: center; }
  .calib-notes { color: #ffd28a; font-size: 38px; letter-spacing: 8px; animation: notePulse 1.2s ease-in-out infinite; }
  @keyframes notePulse { 50% { transform: translateY(-6px); opacity: .6; } }

  .msg.rec { display: flex; flex-direction: column; gap: 6px; }
  .msg.rec video { width: 100%; border-radius: 8px; background: #000; }
  .msg.rec a { color: var(--accent); }
  .diag-foot small { color: #ffd28a; font-size: 18px; text-shadow: 0 2px 10px rgba(0,0,0,.8); }
  .diag-text {
    position: relative; text-align: center; opacity: 0; transition: opacity .6s;
    display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 600px; padding: 16px;
  }
  .diag-text.show { opacity: 1; }
  .diag-text.err { color: #8b8b8b; font: 14px/1.5 ui-monospace, Menlo, monospace; }
  .diag-text.err b { color: #cfcfcf; font-size: 16px; }
  .diag-text.big { color: #fff; font: 600 clamp(28px, 5vw, 48px)/1.2 Georgia, "Times New Roman", serif; text-shadow: 0 2px 24px rgba(0,0,0,.8); }
  .diag-text.big small { font: 400 18px/1.4 system-ui, sans-serif; color: #ffd28a; margin-top: 6px; }
  .diag-text button { margin-top: 20px; font: 600 15px system-ui, sans-serif; }
  .diag .err-icon { font-size: 28px; color: #777; }
  .diag .spin {
    width: 22px; height: 22px; border: 2px solid #333; border-top-color: #888; border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* theater: player fullscreen, call floats in the corner */
  body.theater header { display: none; }
  body.theater main { grid-template-columns: 1fr; padding: 0; height: 100vh; }
  body.theater .screen { border-radius: 0; }
  body.theater .stage .bar { position: fixed; left: 12px; bottom: 12px; z-index: 6; opacity: .25; transition: opacity .2s; }
  body.theater .stage .bar:hover { opacity: 1; }
  body.theater .stage .bar form, body.theater .stage .bar .partner-time { display: none; }
  body.theater aside { position: fixed; right: 12px; bottom: 12px; width: 260px; z-index: 6; }
  body.theater .chat { display: none; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; height: auto; }
    .screen { flex: none; aspect-ratio: 16 / 9; }
    .status b { max-width: 40vw; }
    header .copy-label { display: none; }
  }
</style>
</head>
<body>

<div class="lobby" id="lobby">
  <form class="card" id="lobbyForm">
    <h1 id="lobbyTitle">🍿 Смотрим вместе</h1>
    <p id="lobbyText">Сериал синхронно у обоих, видеозвонок и чат сбоку. Чтобы позвать второго человека, просто отправь ему ссылку на эту страницу.</p>
    <input type="text" id="nameInput" placeholder="Как тебя зовут" maxlength="24" required>
    <div class="checks">
      <label><input type="checkbox" id="wantCam" checked> Камера</label>
      <label><input type="checkbox" id="wantMic" checked> Микрофон</label>
      <label id="eggsLabel" class="hidden"><input type="checkbox" id="wantEggs" checked> 🤫 Пасхалки</label>
    </div>
    <button class="primary" type="submit" id="enterBtn">Войти в комнату</button>
    <button type="button" id="notMeBtn" class="hidden">Нет, я не она</button>
    <p class="hint">Лучше сидеть в наушниках, иначе звук сериала будет попадать в микрофон.</p>
  </form>
</div>

<header>
  <div class="logo">Смотрим <span>вместе</span></div>
  <div class="status" id="status"><i></i><b id="statusText">Подключаюсь…</b></div>
  <div class="spacer"></div>
  <button id="copyBtn">🔗 <span class="copy-label">Скопировать ссылку</span></button>
</header>

<main>
  <section class="stage">
    <div class="screen">
      <iframe id="player" allow="autoplay; fullscreen; encrypted-media; picture-in-picture; clipboard-write" allowfullscreen></iframe>
      <div class="reactions" id="reactions"></div>
      <div class="next-up hidden" id="nextUp"><span id="nextUpText"></span>
        <button class="primary" id="nextNowBtn">Сейчас</button><button id="nextCancelBtn">Отмена</button></div>
    </div>
    <div class="bar">
      <span class="partner-time" id="partnerTime"></span>
      <button class="emoji" data-r="❤️">❤️</button>
      <button class="emoji" data-r="😂">😂</button>
      <button class="emoji" data-r="😱">😱</button>
      <button class="emoji" data-r="🔥">🔥</button>
      <button id="nextBtn" title="Включить следующую серию у обоих">⏭ Дальше</button>
      <button id="syncBtn" title="Перемотать к тому месту, где сейчас партнёр">⟲ Синхр.</button>
      <button id="theaterBtn" title="Плеер на весь экран, звонок в углу">⛶ Кино</button>
      <form id="videoForm">
        <input type="text" id="videoInput" placeholder="Ссылка на серию с rutube.ru">
        <button type="submit">Открыть</button>
      </form>
    </div>
  </section>

  <aside>
    <div class="call">
      <div class="remote">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="placeholder" id="remotePlaceholder">
          <div class="avatar" id="remoteAvatar">?</div>
          <div id="remoteNote">Ждём второго человека</div>
        </div>
        <span class="tag hidden" id="remoteTag"></span>
        <div class="local" id="localBox"><video id="localVideo" autoplay playsinline muted></video></div>
      </div>
      <div class="controls">
        <button id="micBtn">🎙 Микрофон</button>
        <button id="camBtn">📷 Камера</button>
        <label title="Громкость голоса партнёра">🔊 <input type="range" id="voiceVol" min="0" max="1" step="0.05" value="1"></label>
      </div>
    </div>
    <div class="chat">
      <div class="messages" id="messages"></div>
      <form id="chatForm">
        <input type="text" id="chatInput" placeholder="Написать…" autocomplete="off">
        <button type="submit">➤</button>
      </form>
    </div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const DEFAULT_VIDEO = { id: '97833bced1df936a5e23de19a078ea5e', key: '' };
// The Breaking Bad playlist (rutube.ru/plst/853620) in order, as [video id, label].
// Rutube's API sends no CORS headers, so the page can't fetch it and keeps a copy here.
const EPISODES = [["451d239b2c513d511c13ddb7a05b518b","1×01"],["094393e4ea1c4a1cdf4bbbfef8ac0b56","1×02"],["ac1b0b75ccb7442c3404d5d0b7768e4e","1×03"],["85d7c3d651638d7f9b88c257704205e8","1×04"],["ae85886e1fd457b327747b7c3635ea22","1×05"],["b691536d9cf6c7aa7239f03343b40c97","1×06"],["09fce4f1bc37fc654b38c815f5b200c9","1×07"],["6c211a4daeca3d6f074fbd495c03ac5e","2×01"],["2c5a3c13e3869b8f1ef0a3b3d08639f7","2×02"],["202297ebbea5a4845b1372b49bddd6be","2×03"],["4b148626fd5bba3eb9abf6f67a811ad2","2×04"],["0afa81de42561a54ab9b27b95ec0bea8","2×05"],["dec8709981e684f4035e2dfa704e733a","2×06"],["42fc2029b4771461c268791dba41e5f5","2×07"],["6465d65a58cca00c44000fe55059caef","2×08"],["f7aa36a9e3784946fbe9dad7b7cf3db9","2×09"],["1852cc42cf198cc8832c7340beba8771","2×10"],["aa08ef3679795d016992e742edfc7a91","2×11"],["aff3a945678467c03759d3b336002ba0","2×12"],["6a04f2ced31f9b6f0763e861d6636117","2×13"],["2b966e6c7c4693a4973788ea1277499f","3×01"],["65a52d41c89329a46faa76796bb412ac","3×02"],["67aab348f7bf6e0a4820d42cf55998b5","3×03"],["58f7a559d61f88fdeff743494adafca6","3×04"],["f527996f7c9e85a4af8d4b1a5f0fa923","3×05"],["4895268ecb2b07d72f531ed66741c8de","3×06"],["02198a6b7c4b5e37a0a8e0531a0ae8f3","3×07"],["7645295b034406d5d2defe9b4ae3ed06","3×08"],["3e072f8cfa62f2dbcd9d3d15e949e31f","3×09"],["73012e63b8361afa3022a5ca56ba885c","3×10"],["82063b28a11491796bc1f1501d1dcd55","3×11"],["422c866ec1ad5dc616ad4984372dd59a","3×12"],["04f6192d03087cb8be7d6b1a036e6412","3×13"],["8a6d61a4c83264f9a1c0ab76eef5593e","4×01"],["61c0f1ba6e97b5cafcbebe3658fd6b5a","4×02"],["d4e05201c0ebd627afaf309c335ee5f3","4×03"],["ef07679bf93ecc4e968cee557a5b49d4","4×04"],["414a8e2a91781d8db1d3ab20debdba7a","4×05"],["97833bced1df936a5e23de19a078ea5e","4×06"],["9b82e21efe98367ce64da3a75917850f","4×07"],["1296abfb58fb4025cfb30622a0ccd6f4","4×08"],["6e00e1683df4cee70d2df65fc32e78a5","4×09"],["23608707782d34e3c3bc64b68acfef87","4×10"],["b13dee0c3ac1762b99585598991389cc","4×11"],["436245800478678bd2c7e12b838d74e5","4×12"],["25cc6e4da2b3450799abc75f1fce9ea2","4×13"],["2c92406d007fbdb48b9f67bb2cfb77dd","5×01"],["a8b49382f3d98a9ad1c8a6b7a92682da","5×02"],["e2ec9c556c1621f7182d1c01c9cf8636","5×03"],["21e51d4e7be224637fbfeb1d40ae783b","5×04"],["baad320c033e4b4f2330e5b0f14d3a07","5×05"],["6db50465247267a2ede1ed3891c88b84","5×06"],["a483c6643be4ecff4c1f0e2faf669cc4","5×07"],["580c36dd3c935d19fd7777330ec0edaf","5×08"],["50b035d3d90ba0ca384dd8875968e8e4","5×09"],["db8dfbc86f668a6d93fb6be2c76cb2fb","5×10"],["480c41a69daab00238c65c41edbf3c5c","5×11"],["4c51f8b30e79d7fa1854314658ac3575","5×12"],["83d95415778ec089bc62a1681d0d965f","5×13"],["6236a5b0bcf6fe84f374615b50866b38","5×14"],["689e4a1bee296f325bbd6fed5491570e","5×15"],["8e9fd62bfb30ff50c747b25499114858","5×16"],["2d5b0af68514b28f1229ff28cbc02cd8","El Camino"]];
const $ = s => document.querySelector(s);
const now = () => performance.now();

// ---------- room ----------
const hashParams = new URLSearchParams(location.hash.slice(1));
const DEMO = hashParams.has('demo');
const TEST = new URLSearchParams(location.search).has('test');
let room = hashParams.get('r');
if (!room) {
  room = Math.random().toString(36).slice(2, 8);
  history.replaceState(null, '', '#r=' + room);
  if (!DEMO) store('smotrim:own:' + room, 1);
}
const IS_OWNER = !!store('smotrim:own:' + room);
const HOST_ID = 'smotrim-vmeste-' + room;
const SAVE_KEY = 'smotrim:' + room;

function store(key, val, storage = localStorage) {
  try { if (val === undefined) return JSON.parse(storage.getItem(key)); storage.setItem(key, JSON.stringify(val)); }
  catch { return null; }
}
// lives while the tab is open (survives reloads), gone once it's closed
const sessionStore = (key, val) => store(key, val, sessionStorage);

// ---------- ui helpers ----------
let myName = '', partnerName = '';
const who = () => partnerName || 'Партнёр';

function setStatus(text, kind = '') {
  $('#statusText').textContent = text;
  $('#status').className = 'status ' + kind;
}
let toastTimer;
function toast(text) {
  const t = $('#toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
function fmt(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function addMessage(text, kind) {
  const el = document.createElement('div');
  el.className = 'msg ' + kind;
  el.textContent = text;
  const box = $('#messages');
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}
function floatReaction(emoji) {
  const el = document.createElement('span');
  el.textContent = emoji;
  el.style.left = (10 + Math.random() * 80) + '%';
  $('#reactions').appendChild(el);
  setTimeout(() => el.remove(), 2700);
}

// ---------- rutube player ----------
const frame = $('#player');
const P = { id: null, key: '', time: 0, at: 0, playing: false, ready: false, pendingSeek: null, autoplay: false, loadedAt: 0 };
let quietUntil = 0;     // player events before this moment come from remote commands, don't echo them
let localActionAt = 0;  // last time this user touched the player
const quiet = ms => { quietUntil = Math.max(quietUntil, now() + ms); };

function cmd(type, data = {}) {
  frame.contentWindow && frame.contentWindow.postMessage(JSON.stringify({ type, data }), '*');
}
function curTime() {
  return P.time + (P.playing ? (now() - P.at) / 1000 : 0);
}
function parseRutube(str) {
  const m = String(str).match(/([a-f0-9]{32})/i);
  if (!m) return null;
  const key = (String(str).match(/[?&]p=([\w-]+)/) || [])[1] || '';
  return { id: m[1].toLowerCase(), key };
}
function loadVideo(id, key = '', startAt = null, autoplay = false) {
  P.id = id; P.key = key; P.time = startAt || 0; P.at = now(); P.playing = false; P.ready = false;
  P.pendingSeek = startAt; P.autoplay = autoplay; P.loadedAt = now();
  quiet(3000);
  cancelNextUp();
  frame.src = 'https://rutube.ru/play/embed/' + id + (key ? '?p=' + encodeURIComponent(key) : '');
  const ep = EPISODES[episodeIndex(id)];
  $('#nextBtn').title = ep ? 'Сейчас ' + ep[1] + '. Включить следующую серию у обоих' : 'Включить следующую серию у обоих';
}
const episodeIndex = id => EPISODES.findIndex(e => e[0] === id);
const episodeLabel = id => (EPISODES[episodeIndex(id)] || [, 'новую серию'])[1];
function seekTo(t) {
  cmd('player:setCurrentTime', { time: t });
  P.time = t; P.at = now();
}

addEventListener('message', e => {
  if (e.source !== frame.contentWindow) return;
  let m = e.data;
  if (typeof m === 'string') { try { m = JSON.parse(m); } catch { return; } }
  if (!m || typeof m.type !== 'string') return;
  const d = m.data || {};

  if (m.type === 'player:ready') {
    P.ready = true;
    if (P.pendingSeek) { quiet(1500); seekTo(P.pendingSeek); }
    P.pendingSeek = null;
    if (P.autoplay) { P.autoplay = false; quiet(2000); cmd('player:play'); }
  } else if (m.type === 'player:playComplete') {
    onEnded();
  } else if (m.type === 'player:changeState') {
    if (d.state === 'ended' || d.state === 'completed') onEnded();
    if (!['playing', 'pause', 'paused', 'stopped', 'ended', 'completed'].includes(d.state)) return;
    const playing = d.state === 'playing';
    if (playing === P.playing) return;
    P.time = curTime(); P.at = now(); P.playing = playing;
    if (now() > quietUntil) {
      localActionAt = now();
      send({ t: playing ? 'play' : 'pause', time: P.time });
    }
  } else if (m.type === 'player:currentTime') {
    const t = Number(d.time);
    if (!isFinite(t)) return;
    // forward jump beyond playback speed, or going backwards = the user scrubbed the timeline
    const jumped = t - curTime() > 2.5 || t < P.time - 1.5;
    P.time = t; P.at = now();
    if (jumped && P.ready && now() > quietUntil) {
      localActionAt = now();
      send({ t: 'seek', time: t });
    }
  }
});

// Next episode: the button switches both of us at once; at the end of an episode the next one
// starts by itself after a countdown. Only the host counts down, so it doesn't load twice.
let nextUpTimer = null;
function nextEpisode() {
  const i = episodeIndex(P.id);
  if (i < 0) { toast('Эта серия не из плейлиста, следующую не знаю'); return; }
  if (i + 1 >= EPISODES.length) { toast('Это было последнее 🎬'); return; }
  const [id, label] = EPISODES[i + 1];
  loadVideo(id, '', null, true);
  send({ t: 'load', id, key: '', play: true });
  addMessage('⏭ Включаем ' + label, 'sys');
}
function onEnded() {
  const i = episodeIndex(P.id);
  if (nextUpTimer || i < 0 || i + 1 >= EPISODES.length || role === 'guest' && partner) return;
  let left = 10;
  const tick = () => {
    if (left <= 0) { nextEpisode(); return; }
    $('#nextUpText').textContent = 'Серия ' + EPISODES[i + 1][1] + ' через ' + left + ' с';
    left--;
    nextUpTimer = setTimeout(tick, 1000);
  };
  $('#nextUp').classList.remove('hidden');
  tick();
}
function cancelNextUp() {
  clearTimeout(nextUpTimer);
  nextUpTimer = null;
  $('#nextUp').classList.add('hidden');
}

function applyRemote(m) {
  quiet(1500);
  if (m.t === 'seek' || (role === 'guest' && Math.abs(curTime() - m.time) > 2)) seekTo(m.time);
  if (m.t === 'play' && !P.playing) cmd('player:play');
  if (m.t === 'pause' && P.playing) cmd('player:pause');
}

// ---------- media ----------
let localStream = null;
const CAM = { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' };
async function getMedia(video, audio) {
  if (!video && !audio) return null;
  const constraints = {
    video: video ? CAM : false,
    audio: audio ? { echoCancellation: true, noiseSuppression: true, autoGainControl: true } : false,
  };
  try { return await navigator.mediaDevices.getUserMedia(constraints); }
  catch (err) {
    if (video && audio) {
      toast('Камера недоступна, пробую только микрофон');
      return getMedia(false, true);
    }
    toast('Нет доступа к камере/микрофону: ' + err.name);
    return null;
  }
}
function track(kind) { return localStream && localStream.getTracks().find(t => t.kind === kind); }
function refreshMediaButtons() {
  const mic = track('audio'), cam = track('video');
  $('#micBtn').classList.toggle('off', !mic || !mic.enabled);
  $('#camBtn').classList.toggle('off', !cam || !cam.enabled);
  $('#localBox').classList.toggle('hidden', !cam || !cam.enabled);
}
function toggleTrack(kind) {
  const t = track(kind);
  if (!t) { toast(kind === 'video' ? 'Камера не подключена' : 'Микрофон не подключен'); return; }
  t.enabled = !t.enabled;
  refreshMediaButtons();
  syncNinja();
  if (kind === 'video') send({ t: 'cam', on: t.enabled });
}

// When the direct link doesn't get through (a VPN, a strict network), the call moves to VDO.Ninja,
// a free video chat with its own relay servers, embedded in the call panel. Each side switches on
// its own, since both see the same failure; our mic and camera buttons drive it through postMessage.
// On Windows a camera serves only one taker at a time, so ours is let go while VDO.Ninja runs.
let ninja = null, ninjaOut = false;
function ninjaSrc() {
  const mic = track('audio'), cam = track('video');
  const q = new URLSearchParams({ room: 'smotrimvmeste' + room.replace(/\W/g, ''), label: myName || 'Гость', password: 'false' });
  return 'https://vdo.ninja/?' + q + '&webcam&autostart&cleanoutput' +
    '&videodevice=' + (cam ? 1 : 0) + '&audiodevice=' + (mic ? 1 : 0);
}
function startNinja(quietly = false) {
  if (ninja || ninjaOut) return;
  if (call) { call.close(); call = null; }
  const cam = track('video');
  if (cam) cam.stop();
  ninja = document.createElement('iframe');
  ninja.allow = 'camera; microphone; autoplay; fullscreen';
  ninja.src = ninjaSrc();
  ninja.onload = () => { syncNinja(); setTimeout(syncNinja, 4000); };
  $('.remote').appendChild(ninja);
  // some browsers won't hand the camera to an embedded page; a tab of its own asks for it directly
  const out = document.createElement('button');
  out.className = 'ninja-out';
  out.textContent = '↗ Звонок в отдельной вкладке';
  out.title = 'Если в окошке «Problem with Camera»';
  out.onclick = () => {
    window.open(ninjaSrc(), '_blank');
    ninjaOut = true;
    stopNinja(true);
    $('#remoteNote').textContent = 'Звонок открыт в отдельной вкладке';
  };
  ninja.out = out;
  $('.remote').appendChild(out);
  $('#localBox').classList.add('hidden');
  if (!quietly) addMessage('Видео идёт через запасной сервис, напрямую не пробилось', 'sys');
}
function stopNinja(keepCamOff = false) {
  if (!ninja) return;
  ninja.remove();
  ninja.out.remove();
  ninja = null;
  if (!keepCamOff) takeCamBack();
  refreshMediaButtons();
}
async function takeCamBack() {
  const t = track('video');
  if (!t || t.readyState === 'live') return;
  await new Promise(r => setTimeout(r, 800)); // let the iframe's capture close first
  try {
    const fresh = (await navigator.mediaDevices.getUserMedia({ video: CAM })).getVideoTracks()[0];
    fresh.enabled = t.enabled;
    localStream.removeTrack(t);
    localStream.addTrack(fresh);
    refreshMediaButtons();
  } catch {}
}
function syncNinja() {
  if (!ninja || !ninja.contentWindow) return;
  const mic = track('audio'), cam = track('video'), post = m => ninja.contentWindow.postMessage(m, '*');
  if (mic) post({ mic: mic.enabled });
  if (cam) post({ camera: cam.enabled });
  post({ volume: +$('#voiceVol').value });
  $('#localBox').classList.add('hidden');
}

// ---------- peer ----------
let peer = null, conn = null, call = null, role = null, lastSeen = 0, partner = null, retryTimer = null;
let relayTo = null, linkedAt = 0;
const direct = () => !!(conn && conn.open);
const linked = () => direct() || !!relayTo;

// When the direct WebRTC link can't get through someone's network (mobile internet, strict
// routers, there's no working free TURN relay), sync and chat go through the PeerJS signalling
// server instead, dressed up as ICE candidate messages (it drops anything shaped otherwise) and
// forwarded to the other peer as is. The video call still needs the direct link.
const INSTANCE = Math.random().toString(36).slice(2);
const RELAY_CONN = 'dc_watch_relay';
function relaySend(dst, m) {
  if (!peer || !peer.open) return;
  peer.socket.send({ type: 'CANDIDATE', dst, payload: {
    connectionId: RELAY_CONN, type: 'data', candidate: { candidate: '', sdpMid: '0', sdpMLineIndex: 0 }, watch: m,
  } });
}
function listenRelay(p) {
  p.socket.on('message', msg => {
    if (msg.type !== 'CANDIDATE' || !msg.payload || msg.payload.connectionId !== RELAY_CONN) return;
    // PeerJS files these away for a connection that never comes; don't let them pile up
    if (p._lostMessages) p._lostMessages.delete(RELAY_CONN);
    if (p === peer && msg.payload.watch) onRelay(msg.src, msg.payload.watch);
  });
}
function onRelay(src, m) {
  if (m.t === 'knock') {
    // the server keeps messages for an absent id, so skip stale knocks and our own from before a reload
    if (role !== 'host' || m.me === INSTANCE || Math.abs(Date.now() - m.at) > 30000) return;
    relaySend(src, { t: 'knocked' });
    if (src === relayTo) return;
    const already = direct() && conn.peer === src; // then the server path is only kept as a spare
    relayTo = src;
    if (!already) onLinked();
  } else if (m.t === 'knocked') {
    if (role === 'guest' && src === HOST_ID && !relayTo) { relayTo = src; if (!direct()) onLinked(); }
  } else if (src === relayTo) onData(m);
}
function knock() {
  if (role === 'guest' && !relayTo) relaySend(HOST_ID, { t: 'knock', me: INSTANCE, at: Date.now() });
}
function onLinked() {
  lastSeen = linkedAt = now();
  setStatus(direct() ? 'На связи' : 'На связи через сервер', 'ok');
  send({ t: 'hello', name: myName, cam: !!(track('video') && track('video').enabled) });
  if (role === 'host') sendState('state');
  if (role === 'guest' && !call) startCall();
}
function dropPartner() {
  const c = conn, had = partner;
  conn = null; relayTo = null; partner = null;
  if (c) c.close();
  stopNinja();
  if (call) { call.close(); call = null; }
  showRemote(null);
  if (had) addMessage(who() + ' вышел(а) из комнаты', 'sys');
  $('#partnerTime').textContent = '';
  if (role === 'guest') { setStatus('Переподключаюсь…'); retry(1500); }
  else setStatus('Ждём второго. Отправь ссылку');
}

function retry(ms) {
  const p = peer;
  peer = null; relayTo = null;
  if (p) p.destroy(); // may call back into retry through the closing connection
  clearTimeout(retryTimer);
  retryTimer = setTimeout(start, ms);
}

// Whoever opens the room first takes the fixed host id; the second one connects to it.
function start() {
  role = null;
  setStatus('Подключаюсь…');
  const p = peer = new Peer(HOST_ID);
  listenRelay(p);
  p.on('open', () => {
    role = 'host';
    if (!linked()) setStatus('Ждём второго. Отправь ссылку');
  });
  p.on('connection', c => {
    const old = conn;
    conn = null;
    if (old) old.close();
    bindConn(c);
  });
  p.on('call', c => {
    if (call) call.close();
    c.answer(localStream || undefined);
    bindCall(c);
  });
  p.on('error', err => {
    if (p !== peer) return;
    if (err.type === 'unavailable-id') { p.destroy(); joinAsGuest(); }
    else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
      setStatus('Нет связи с сервером, пробую снова…', 'bad');
      retry(3000);
    } else console.warn(err);
  });
  p.on('disconnected', () => { if (p === peer && !p.destroyed) p.reconnect(); });
}

function joinAsGuest() {
  const p = peer = new Peer();
  listenRelay(p);
  p.on('open', () => {
    role = 'guest';
    bindConn(p.connect(HOST_ID, { reliable: true }));
    // after a moment, so a missing host shows up as 'peer-unavailable' first
    setTimeout(() => { if (p === peer) knock(); }, 1500);
    setTimeout(() => { if (p === peer) knock(); }, 6000);
  });
  p.on('call', c => { if (call) call.close(); c.answer(localStream || undefined); bindCall(c); });
  p.on('error', err => {
    if (p !== peer) return;
    // host went away between our attempts, try to become host ourselves
    if (err.type === 'peer-unavailable') retry(1000);
    else if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
      setStatus('Нет связи с сервером, пробую снова…', 'bad');
      retry(3000);
    } else console.warn(err);
  });
  p.on('disconnected', () => { if (p === peer && !p.destroyed) p.reconnect(); });
}

function bindConn(c) {
  conn = c;
  c.on('open', () => {
    if (conn !== c) return;
    // already talking through the server: just switch over to the direct link
    if (relayTo === c.peer) { lastSeen = now(); setStatus('На связи', 'ok'); return; }
    relayTo = null;
    onLinked();
  });
  c.on('data', onData);
  c.on('close', () => {
    if (conn !== c) return;
    // the direct link failed or dropped, but the server path still works
    if (relayTo) { conn = null; setStatus('На связи через сервер', 'ok'); return; }
    dropPartner();
  });
}

function startCall() {
  const c = peer.call(HOST_ID, localStream || new MediaStream(), {
    constraints: { offerToReceiveAudio: true, offerToReceiveVideo: true },
  });
  if (c) bindCall(c);
}
function bindCall(c) {
  call = c;
  c.on('stream', s => { if (call === c && !ninja) showRemote(s); });
  c.on('close', () => { if (call === c) { call = null; showRemote(null); } });
}
function showRemote(stream) {
  const v = $('#remoteVideo');
  if (v.srcObject !== stream) v.srcObject = stream;
  updateRemotePlaceholder();
}
function updateRemotePlaceholder() {
  const v = $('#remoteVideo');
  const hasVideo = v.srcObject && v.srcObject.getVideoTracks().length && partner && partner.cam !== false;
  $('#remotePlaceholder').classList.toggle('hidden', !!hasVideo);
  $('#remoteAvatar').textContent = partner ? (who()[0] || '?').toUpperCase() : '?';
  $('#remoteNote').textContent = !partner ? 'Ждём второго человека' : partner.cam === false ? who() + ' без камеры' :
    ninjaOut ? 'Звонок открыт в отдельной вкладке' :
    !direct() && now() - linkedAt > 20000 ? 'Напрямую видео не пробилось, включаю запасное…' : 'Соединяю видео…';
  $('#remoteTag').textContent = who();
  $('#remoteTag').classList.toggle('hidden', !partner);
}

function send(m) {
  if (direct()) conn.send(m);
  else if (relayTo) relaySend(relayTo, m);
}
function sendState(t) {
  send({ t, id: P.id, key: P.key, time: curTime(), playing: P.playing });
}

function onData(m) {
  lastSeen = now();
  if (!m || typeof m !== 'object') return;
  switch (m.t) {
    case 'hello':
      partnerName = String(m.name || '').slice(0, 24);
      partner = { cam: m.cam, time: 0, playing: false, at: now() };
      addMessage(who() + ' в комнате', 'sys');
      toast(who() + ' подключился(лась) 👋');
      updateRemotePlaceholder();
      if (TEST && eggsOn) setTimeout(fireNext, 3000);
      break;
    case 'cam':
      if (partner) partner.cam = m.on;
      updateRemotePlaceholder();
      break;
    case 'play':
    case 'pause':
    case 'seek':
      applyRemote(m);
      toast(who() + ': ' + (m.t === 'play' ? '▶ играет' : m.t === 'pause' ? '⏸ пауза' : '⏩ перемотка на ' + fmt(m.time)));
      break;
    case 'load':
      if (m.id === P.id && now() - P.loadedAt < 5000) break; // we both pressed it
      loadVideo(m.id, m.key, null, !!m.play);
      toast(who() + ' включает ' + episodeLabel(m.id));
      addMessage(who() + ' включает ' + episodeLabel(m.id), 'sys');
      break;
    case 'state':
    case 'tick':
      onTick(m);
      break;
    case 'chat':
      addMessage(String(m.text).slice(0, 500), 'them');
      break;
    case 'react':
      floatReaction(String(m.e).slice(0, 4));
      break;
    case 'diag':
      showDiag(String(m.from || '').slice(0, 24));
      break;
    case 'song':
      playSongNow();
      break;
    case 'songDone':
      onSongDone();
      break;
    case 'recStart':
      incoming = { id: m.id, n: m.n, type: m.type, parts: [], got: 0 };
      toast(who() + ' отправляет видео своей реакции 🎥');
      break;
    case 'recPart':
      if (incoming && m.id === incoming.id && !incoming.parts[m.i]) { incoming.parts[m.i] = m.b64 ? fromBase64(m.b64) : m.data; incoming.got++; }
      break;
    case 'recEnd':
      if (incoming && m.id === incoming.id && incoming.got === incoming.n) showRecording(new Blob(incoming.parts, { type: incoming.type }));
      incoming = null;
      break;
  }
}

// A 20-second clip (already faded out at the end), loaded ahead so the click can start it.
const SONG = { src: 'chime.mp3', volume: 1 };
function prepareSong() {
  const audio = new Audio(SONG.src);
  audio.preload = 'auto';
  audio.volume = SONG.volume;
  const song = { ready: true };
  audio.onerror = () => { song.ready = false; };
  song.play = () => new Promise(resolve => {
    let finished = false;
    const done = () => { if (!finished) { finished = true; resolve(); } };
    audio.onended = done;
    audio.onerror = done;
    audio.play().catch(done);
    setTimeout(done, 30000); // if it stalls
  });
  return song;
}

// Her side: "sound calibration" asks for full volume, then plays the track; the show pauses
// for both meanwhile and resumes after.
async function playSongNow() {
  if (document.querySelector('.calib')) return;
  if (document.fullscreenElement && document.fullscreenElement !== document.documentElement) {
    document.exitFullscreen().catch(() => {});
  }
  const song = prepareSong();
  const wasPlaying = P.playing;
  if (wasPlaying) cmd('player:pause');
  const el = document.createElement('div');
  el.className = 'calib';
  el.innerHTML = `<div class="card calib-card">
    <h1>✋ Стоп!</h1>
    <p>Нужно откалибровать звук. Сделай, пожалуйста, громкость на максимум 🔊 и нажми «Готово».</p>
    <button class="primary">Готово</button></div>`;
  document.body.appendChild(el);
  await new Promise(r => { el.querySelector('button').onclick = r; });
  el.querySelector('.calib-card').innerHTML = '<div class="calib-notes">♪ ♫ ♪</div><p>Калибровка звука…</p>';
  await song.play();
  el.classList.add('bye');
  setTimeout(() => el.remove(), 700);
  send({ t: 'songDone' });
  if (wasPlaying) cmd('player:play');
}

// ---------- reaction recording ----------
// Recorded only in her browser while the compliment plays; at the end she decides whether
// to send it, keep it or delete it.
function startRecording(camStream) {
  if (!camStream || !window.MediaRecorder) return null;
  const tracks = [...camStream.getVideoTracks()];
  const mic = track('audio');
  if (mic) tracks.push(mic);
  const type = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm']
    .find(t => MediaRecorder.isTypeSupported(t));
  if (!type) return null;
  let rec;
  try { rec = new MediaRecorder(new MediaStream(tracks), { mimeType: type, videoBitsPerSecond: 1500000 }); }
  catch { return null; }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.start(1000);
  return {
    stop: () => new Promise(resolve => {
      rec.onstop = () => resolve(new Blob(chunks, { type: type.split(';')[0] }));
      rec.stop();
    }),
  };
}
const recName = type => 'reakciya-' + new Date().toISOString().slice(0, 10) + (type.includes('mp4') ? '.mp4' : '.webm');
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
}
// Over the server path it goes as small base64 pieces: the server cuts off messages much over 16 KB.
async function sendRecording(blob, onProgress) {
  const buf = await blob.arrayBuffer(), viaServer = !direct();
  const size = viaServer ? 9 * 1024 : 64 * 1024, n = Math.ceil(buf.byteLength / size), id = Date.now();
  send({ t: 'recStart', id, n, type: blob.type });
  for (let i = 0; i < n; i++) {
    while (conn && conn.dataChannel && conn.dataChannel.bufferedAmount > (1 << 20)) {
      await new Promise(r => setTimeout(r, 50));
    }
    const part = buf.slice(i * size, (i + 1) * size);
    if (viaServer) {
      send({ t: 'recPart', id, i, b64: toBase64(part) });
      await new Promise(r => setTimeout(r, 30));
    } else send({ t: 'recPart', id, i, data: part });
    onProgress((i + 1) / n);
  }
  send({ t: 'recEnd', id });
}
function toBase64(buf) {
  let s = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 4096) s += String.fromCharCode(...bytes.subarray(i, i + 4096));
  return btoa(s);
}
const fromBase64 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
// His side: the received video lands in the chat with a preview and a download link.
let incoming = null;
function showRecording(blob) {
  const url = URL.createObjectURL(blob);
  const el = document.createElement('div');
  el.className = 'msg them rec';
  el.innerHTML = `<div>🎥 Реакция: ${esc(who())}</div><video controls playsinline src="${url}"></video><a download="${recName(blob.type)}" href="${url}">⬇ Скачать видео</a>`;
  const box = $('#messages');
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
  toast('🎥 ' + who() + ' прислала видео реакции, оно в чате');
}

// Her camera for the compliment: the call's one if it's on; if she wanted one but it never
// started, ask the browser once more. A camera she unticked or switched off stays off.
let wantedCam = false;
async function camForDiag() {
  const t = track('video');
  if (t && t.readyState === 'live') return t.enabled ? { stream: localStream, own: false } : null;
  if (t && !t.enabled) return null; // she turned it off
  if (!wantedCam) return null;
  try {
    const ask = navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    const stream = await Promise.race([ask, new Promise(r => setTimeout(() => r(null), 8000))]);
    if (!stream) { ask.then(s => s.getTracks().forEach(t => t.stop())).catch(() => {}); return null; }
    return { stream, own: true };
  } catch { return null; }
}

// Red marker over the reflection: a hand-drawn circle, an arrow and a caption.
function drawMark(el) {
  const W = innerWidth, H = innerHeight;
  const cx = W / 2, cy = H * 0.52, r = Math.min(H * 0.24, W * 0.2);
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  el.appendChild(svg);
  const path = (d, delay, dur) => {
    const p = document.createElementNS(ns, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
    const len = p.getTotalLength();
    p.style.strokeDasharray = len;
    p.style.strokeDashoffset = len;
    p.style.transition = `stroke-dashoffset ${dur}s ease-in-out ${delay}s`;
    return p;
  };

  // wobbly, slightly more than one full turn, like a marker stroke
  let d = '';
  for (let i = 0; i <= 120; i++) {
    const a = -2 + (i / 120) * Math.PI * 2.12;
    const k = 1 + 0.04 * Math.sin(i / 9) + i / 2400;
    d += (i ? 'L' : 'M') + (cx + r * 1.12 * k * Math.cos(a)).toFixed(1) + ',' + (cy + r * k * Math.sin(a)).toFixed(1);
  }
  const head = { x: cx + r * 1.25 * Math.cos(0.75), y: cy + r * 1.12 * Math.sin(0.75) };
  const tail = { x: Math.min(cx + r * 1.9, W - 24), y: Math.min(cy + r * 1.25, H - 150) };
  const ctrl = { x: tail.x, y: head.y };
  const th = Math.atan2(head.y - ctrl.y, head.x - ctrl.x);
  const tip = a => `${(head.x + 26 * Math.cos(th + a)).toFixed(1)},${(head.y + 26 * Math.sin(th + a)).toFixed(1)}`;
  const strokes = [
    path(d, 0, 1.3),
    path(`M${tail.x},${tail.y} Q${ctrl.x},${ctrl.y} ${head.x},${head.y}`, 1.4, 0.7),
    path(`M${tip(2.5)} L${head.x},${head.y} L${tip(-2.5)}`, 2.1, 0.3),
  ];
  void svg.getBoundingClientRect();
  strokes.forEach(p => { p.style.strokeDashoffset = 0; });

  const label = document.createElement('div');
  label.className = 'diag-label';
  label.textContent = DT[7];
  el.appendChild(label);
  const lw = label.offsetWidth;
  label.style.left = Math.max(12, Math.min(W - lw - 12, tail.x - lw / 2)) + 'px';
  label.style.top = (tail.y + 12) + 'px';
  setTimeout(() => label.classList.add('show'), 2400);
}
// Ваня → Ване, Иван → Ивану, Андрей → Андрею: enough for a button label
const dative = n => /[ая]$/i.test(n) ? n.slice(0, -1) + 'е' : /[йь]$/i.test(n) ? n.slice(0, -1) + 'ю' : n + 'у';
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

async function showDiag(from) {
  if (document.querySelector('.diag')) return;
  // the player's own fullscreen would hide this screen
  if (document.fullscreenElement && document.fullscreenElement !== document.documentElement) {
    document.exitFullscreen().catch(() => {});
  }
  quiet(2000);
  if (P.playing) cmd('player:pause');
  document.fonts.load('700 40px Caveat').catch(() => {});

  const el = document.createElement('div');
  el.className = 'diag';
  el.innerHTML = '<video autoplay playsinline muted></video><div class="diag-text"></div>';
  document.body.appendChild(el);
  const text = el.querySelector('.diag-text');
  // VDO.Ninja holds the camera; step it aside for the "calibration" and bring it back after
  const hadNinja = !!ninja;
  if (hadNinja) { stopNinja(true); await new Promise(r => setTimeout(r, 800)); }
  const cam = await camForDiag();
  const camVideo = el.querySelector('video');
  if (cam) { camVideo.srcObject = cam.stream; camVideo.play().catch(() => {}); }
  const rec = startRecording(cam && cam.stream);

  const wait = ms => new Promise(r => setTimeout(r, ms));
  const say = async (html, cls) => {
    text.classList.remove('show');
    await wait(600);
    text.className = 'diag-text ' + cls;
    text.innerHTML = html;
    void text.offsetWidth;
    text.classList.add('show');
  };

  await wait(400);
  await say(`<div class="err-icon">⚠</div><b>${DT[0]}</b><small>${DT[1]}</small><div class="spin"></div><small>${DT[2]}</small>`, 'err');
  await wait(4500);
  await say(`<small>${DT[3]}</small>`, 'err');
  await wait(4500);
  text.classList.remove('show');
  if (cam) {
    await wait(1000);
    el.classList.add('camera'); // her camera takes the whole screen
    await wait(2000);
  } else {
    await wait(3500);           // no camera: pure black, only the reflection in the screen
    el.classList.add('mirror');
    await wait(2500);
  }
  await say(DT[4], 'big');
  await wait(2500);
  text.classList.remove('show');
  await wait(600);
  drawMark(el);
  await wait(3200);
  await say(DT[5], 'big top');
  await wait(2500);
  const foot = document.createElement('div');
  foot.className = 'diag-foot';
  foot.innerHTML = from ? `<small>— ${esc(from)} ❤️</small>` : '';
  const btn = document.createElement('button');
  btn.className = 'primary';
  btn.textContent = DT[6];
  const close = () => {
    el.classList.add('bye');
    setTimeout(() => el.remove(), 800);
  };
  btn.onclick = async () => {
    btn.disabled = true;
    const blob = rec ? await rec.stop() : null;
    if (cam && cam.own) cam.stream.getTracks().forEach(t => t.stop());
    if (hadNinja && partner && !direct()) startNinja(true);
    if (!blob || !blob.size) return close();
    // her call: nothing leaves this browser unless she sends it
    el.classList.add('consent');
    foot.innerHTML = `<small>🎥 Пока шла «проверка», записалась твоя реакция. Видео есть только у тебя, решай сама:</small>
      <div class="diag-choice"></div>`;
    const choice = foot.querySelector('.diag-choice');
    const add = (label, cls, fn) => {
      const b = document.createElement('button');
      b.textContent = label;
      if (cls) b.className = cls;
      b.onclick = fn;
      choice.appendChild(b);
    };
    if (linked()) add('Отправить ' + (from ? dative(from) : 'ему') + ' ❤️', 'primary', async () => {
      choice.innerHTML = '<small>Отправляю… 0%</small>';
      await sendRecording(blob, p => { choice.innerHTML = `<small>Отправляю… ${Math.round(p * 100)}%</small>`; });
      choice.innerHTML = '<small>Отправлено ❤️</small>';
      setTimeout(close, 1200);
    });
    add('Сохранить себе', '', () => { downloadBlob(blob, recName(blob.type)); close(); });
    add('Удалить', '', close);
  };
  foot.appendChild(btn);
  el.appendChild(foot);
  void foot.offsetWidth;
  foot.classList.add('show');
}

// Surprises, sent only from the device that created the room, each once per session:
// first the "sound calibration" with the track after 8–12 minutes of watching together,
// then the compliment after another 8–12 minutes. Five clicks on the logo send the next one
// right away. A ?test run fires them within seconds and remembers nothing.
const STAGE = 'smotrim:stage'; // '' → 'song' (sent) → 'songDone' → 'diag' (sent)
let eggsOn = false;             // the owner's lobby checkbox
let testStage = '', watchedTogether = 0, logoClicks = 0, logoTimer;
const stage = () => TEST ? testStage : (sessionStore(STAGE) || '');
const setStage = s => { if (TEST) testStage = s; else sessionStore(STAGE, s); };
const randomWait = () => 480 + Math.random() * 240;
let nextAt = randomWait(); // seconds of joint watching until the next surprise

function fireNext() {
  if (!eggsOn) return;
  if (!linked() || !partner) { toast('🤫 Её ещё нет в комнате'); return; }
  const tag = TEST ? '🧪 Тест: ' : '';
  if (stage() === '') {
    setStage('song');
    send({ t: 'song' });
    toast(tag + '🎶 Калибровка звука ушла к ней');
  } else if (stage() === 'songDone') {
    setStage('diag');
    send({ t: 'diag', from: myName });
    setTimeout(() => { if (P.playing) cmd('player:pause'); }, 300);
    toast(tag + '🤫 Комплимент ушёл, смотри на её лицо');
  }
}
function onSongDone() {
  if (!eggsOn || stage() !== 'song') return;
  setStage('songDone');
  watchedTogether = 0;
  nextAt = randomWait();
  if (TEST) setTimeout(fireNext, 10000);
}

$('.logo').onclick = () => {
  if (!eggsOn) return;
  logoClicks++;
  clearTimeout(logoTimer);
  logoTimer = setTimeout(() => { logoClicks = 0; }, 1500);
  if (logoClicks >= 5) { logoClicks = 0; fireNext(); }
};

// Both sides send ticks every few seconds; only the guest corrects itself toward the host.
function onTick(m) {
  if (partner) Object.assign(partner, { time: m.time, playing: m.playing, at: now() });
  if (role !== 'guest' || !m.id) return;
  const force = m.t === 'state';
  if (m.id !== P.id) { loadVideo(m.id, m.key, m.time); if (m.playing) setTimeout(() => cmd('player:play'), 2500); return; }
  if (!force && (now() - localActionAt < 4000 || now() < quietUntil)) return;
  if (m.playing !== P.playing) applyRemote({ t: m.playing ? 'play' : 'pause', time: m.time });
  else if (Math.abs(curTime() - m.time) > (force ? 1.5 : 3)) applyRemote({ t: 'seek', time: m.time });
}

setInterval(() => {
  if (P.id) store(SAVE_KEY, { id: P.id, key: P.key, time: curTime() });
  if (!linked()) return;
  sendState('tick');
  updateRemotePlaceholder();
  if (!direct() && partner && now() - linkedAt > 12000) startNinja();
  if (!TEST && eggsOn && partner && P.playing && ['', 'songDone'].includes(stage()) &&
      (watchedTogether += 3) >= nextAt) fireNext();
  if (now() - lastSeen > 15000) { dropPartner(); return; }
  if (partner && partner.at) {
    const t = partner.time + (partner.playing ? (now() - partner.at) / 1000 : 0);
    const diff = curTime() - t;
    $('#partnerTime').textContent = who() + ': ' + (partner.playing ? '▶ ' : '⏸ ') + fmt(t) +
      (Math.abs(diff) > 3 ? '  (разница ' + Math.round(Math.abs(diff)) + ' с)' : '');
  }
}, 3000);

// ---------- controls ----------
$('#micBtn').onclick = () => toggleTrack('audio');
$('#camBtn').onclick = () => toggleTrack('video');
$('#voiceVol').oninput = e => { $('#remoteVideo').volume = +e.target.value; syncNinja(); };

$('#nextBtn').onclick = nextEpisode;
$('#nextNowBtn').onclick = () => { cancelNextUp(); nextEpisode(); };
$('#nextCancelBtn').onclick = cancelNextUp;

$('#syncBtn').onclick = () => {
  if (!partner || !partner.at) { toast('Пока не с кем синхронизироваться'); return; }
  const t = partner.time + (partner.playing ? (now() - partner.at) / 1000 : 0);
  applyRemote({ t: 'seek', time: t });
  applyRemote({ t: partner.playing ? 'play' : 'pause', time: t });
  toast('Подтянул к ' + fmt(t));
};

$('#theaterBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => document.body.classList.toggle('theater'));
};
document.addEventListener('fullscreenchange', () => {
  document.body.classList.toggle('theater', !!document.fullscreenElement);
});

$('#copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(location.href); toast('Ссылка скопирована, отправь её 💌'); }
  catch { prompt('Скопируй ссылку:', location.href); }
};

$('#videoForm').onsubmit = e => {
  e.preventDefault();
  const v = parseRutube($('#videoInput').value);
  if (!v) { toast('Не похоже на ссылку с rutube'); return; }
  loadVideo(v.id, v.key);
  send({ t: 'load', id: v.id, key: v.key });
  $('#videoInput').value = '';
};

$('#chatForm').onsubmit = e => {
  e.preventDefault();
  const text = $('#chatInput').value.trim();
  if (!text) return;
  addMessage(text, 'me');
  send({ t: 'chat', text });
  $('#chatInput').value = '';
};

document.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
  floatReaction(b.dataset.r);
  send({ t: 'react', e: b.dataset.r });
});

// ---------- lobby ----------
$('#nameInput').value = store('smotrim:name') || '';
// only the room's creator gets to switch the surprises on or off
if (IS_OWNER) {
  $('#eggsLabel').classList.remove('hidden');
  $('#wantEggs').checked = store('smotrim:eggs') !== false;
}

// Whoever opens someone else's room link is greeted as the expected guest.
const GUEST_NAME = 'Сабина';
const isGuestLink = !IS_OWNER && !DEMO && hashParams.has('r');
if (isGuestLink) {
  const lobbyDefaults = [$('#lobbyTitle').textContent, $('#lobbyText').textContent, $('#nameInput').value];
  $('#lobbyTitle').textContent = '🎩 Добрый вечер. Вы ' + GUEST_NAME + '?';
  $('#lobbyText').textContent = 'Вас уже ждут. Проходите, присаживайтесь, ваше место у экрана. Попкорн за счёт заведения 🍿';
  $('#nameInput').value = GUEST_NAME;
  $('#nameInput').classList.add('hidden');
  $('#enterBtn').textContent = 'Да, это я';
  $('#notMeBtn').classList.remove('hidden');
  $('#notMeBtn').onclick = () => {
    [$('#lobbyTitle').textContent, $('#lobbyText').textContent, $('#nameInput').value] = lobbyDefaults;
    $('#nameInput').classList.remove('hidden');
    $('#enterBtn').textContent = 'Войти в комнату';
    $('#notMeBtn').classList.add('hidden');
    $('#nameInput').focus();
  };
}
$('#lobbyForm').onsubmit = async e => {
  e.preventDefault();
  myName = $('#nameInput').value.trim();
  store('smotrim:name', myName);
  eggsOn = IS_OWNER && $('#wantEggs').checked;
  if (IS_OWNER) store('smotrim:eggs', eggsOn);
  $('#lobby').classList.add('hidden');
  wantedCam = $('#wantCam').checked;
  localStream = await getMedia(wantedCam, $('#wantMic').checked);
  $('#localVideo').srcObject = localStream;
  refreshMediaButtons();
  const saved = store(SAVE_KEY);
  if (saved && saved.id) loadVideo(saved.id, saved.key, saved.time > 5 ? saved.time - 3 : null);
  else loadVideo(DEFAULT_VIDEO.id, DEFAULT_VIDEO.key);
  // preview: plays the diagnostics locally, no room, nothing remembered
  if (DEMO) { setStatus('Предпросмотр'); setTimeout(() => showDiag(myName), 5000); return; }
  if (isGuestLink && myName === GUEST_NAME) toast('Присаживайтесь, сейчас начнём 🍿');
  start();
};
</script>
